<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM Machine System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 50px 20px;
        }

        .atm {
            max-width: 400px;
            margin: auto;
            padding: 30px;
            background: #1e293b;
            border-radius: 15px;
        }

        input, button {
            padding: 12px;
            margin: 8px;
            border-radius: 6px;
            border: none;
        }

        button {
            background: #38bdf8;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="atm">
        <h1>🏧 ATM Machine System</h1>
        <p>My Python Project — Web Demo</p>

        <h2>Balance: ₹<span id="balance">5000</span></h2>

        <input type="number" id="amount"
               placeholder="Enter amount" min="1">

        <br>

        <button onclick="deposit()">Deposit</button>
        <button onclick="withdraw()">Withdraw</button>

        <p id="message">Welcome! Choose an operation.</p>
    </div>

    <script>
        let balance = 5000;

        function deposit() {
            const amount = Number(
                document.getElementById("amount").value
            );

            if (!Number.isFinite(amount) || amount <= 0) {
                showMessage("Enter a valid amount.");
                return;
            }

            balance += amount;
            updateBalance();
            showMessage("Deposit successful!");
        }

        function withdraw() {
            const amount = Number(
                document.getElementById("amount").value
            );

            if (!Number.isFinite(amount) || amount <= 0) {
                showMessage("Enter a valid amount.");
                return;
            }

            if (amount > balance) {
                showMessage("Insufficient balance!");
                return;
            }

            balance -= amount;
            updateBalance();
            showMessage("Withdrawal successful!");
        }

        function updateBalance() {
            document.getElementById("balance").textContent =
                balance;
            document.getElementById("amount").value = "";
        }

        function showMessage(message) {
            document.getElementById("message").textContent =
                message;
        }
    </script>
</body>
</html>
